<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#f5f5f2"
  >

  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="style.css">

  <title>MURAS — Mountain Memory</title>
</head>

<body>

  <main class="app">

    <!-- HOME -->
    <section id="home">

      <div class="hero">

        <p class="eyebrow">
          MURAS
        </p>

        <h1>
          Mountain<br>
          Memory
        </h1>

        <p class="description">
          Discover the stories of the mountains.
        </p>

        <button id="scanButton">
          SCAN QR
        </button>

      </div>

    </section>


    <!-- QR SCANNER -->
    <section id="scanner" class="hidden">

      <button id="backButton" class="back">
        ← Back
      </button>

      <h2>
        Scan the peak
      </h2>

      <p class="scanner-text">
        Point your camera at the QR code.
      </p>

      <video
        id="camera"
        autoplay
        muted
        playsinline
      ></video>

      <p id="scanStatus"></p>

    </section>


    <!-- PEAK -->
    <section id="peak" class="hidden">

      <div class="photo-container">

        <img
          id="peakPhoto"
          src=""
          alt="Mountain peak"
        >

      </div>


      <div class="content">

        <p class="eyebrow">
          MURAS
        </p>

        <h1>
          Куттуктайбыз!
        </h1>

        <p id="congratulation">
        </p>


        <h2 id="peakName">
        </h2>

        <p id="elevation" class="elevation">
        </p>


        <div class="divider"></div>


        <h3>
          📜 Тарыхы / History
        </h3>


        <h4>
          Кыргызча
        </h4>

        <p id="historyKy">
        </p>


        <h4>
          English
        </h4>

        <p id="historyEn">
        </p>

      </div>

    </section>

  </main>


  <script src="app.js"></script>

</body>

</html>
